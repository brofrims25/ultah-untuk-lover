<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surat Spesial untuk kekasihku ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
        
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: url('background.png') center/cover no-repeat; font-family: 'Dancing Script', cursive; overflow: hidden;
        }

        .emoji-rain { position: absolute; top: -10%; font-size: 20px; animation: rain linear infinite; pointer-events: none; }
        @keyframes rain { to { transform: translateY(110vh) rotate(360deg); } }

        #suratBtn { width: 120px; max-width: 40vw; cursor: pointer; transition: 0.3s; z-index: 10; }
        #suratBtn:hover { transform: scale(1.1) rotate(5deg); }

        #letter-container { 
            display: none; position: relative; 
            width: 90%; max-width: 350px; height: 75vh; max-height: 550px;
            background: rgba(255,255,255,0.95); padding: 20px; border-radius: 15px;
            border: 2px solid #ffccd5; box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            text-align: center;
        }
        
        #text { font-size: clamp(16px, 5vw, 22px); color: #d63384; margin-bottom: 20px; }
        
        /* Foto Hewan */
        #displayImg { width: 140px; height: 140px; object-fit: contain; margin-top: 10px; display: block; margin-left: auto; margin-right: auto; cursor: pointer; transition: 0.2s;}
        #displayImg:active { transform: scale(0.9); }
        
        #cake { font-size: 80px; cursor: pointer; margin-top: 20px; display: none; transition: 0.3s; }
        
        .controls { margin-top: 20px; display: flex; gap: 15px; z-index: 10; }
        button { padding: 12px 20px; cursor: pointer; border-radius: 20px; border: none; background: #ff4757; color: white; font-family: sans-serif; font-size: 14px; }

        #hbd-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 182, 193, 0.95); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center; color: white;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="musik.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound"><source src="tombol.mp3" type="audio/mpeg"></audio>

    <img id="suratBtn" src="surat.png" onclick="start()" alt="Buka Surat">

    <div id="letter-container">
        <div id="text">...</div>
        <img id="displayImg" src="" style="display:none;" onclick="playAnimalSound()">
        <div id="cake" onclick="blowCandle()">🎂</div>
    </div>

    <div class="controls" id="navControls" style="display:none;">
        <button onclick="playClick(); changePage(-1)">⬅️ Mundur</button>
        <button onclick="playClick(); changePage(1)">Maju ➡️</button>
    </div>

    <div id="hbd-overlay" onclick="this.style.display='none'">
        <h1 style="font-size: 50px;">Happy Birthday 18th!</h1>
        <h2 style="font-size: 30px;">Sayangku kekasihku ❤️</h2>
    </div>

    <script>
        const pages = [
            { text: "isi sendiri.", img: "bebek.png" },
            { text: "isi sendiri..", img: "rusa.png" },
            { text: "isi sendiri..", img: "anjing.png" },
            { text: "isi sendiri..", img: "burung.png" },
            { text: "isi sendiri.", img: "kucing.png" },
            { text: "isi sendiri.", img: "cake" }
        ];

        let currentPage = 0;
        let currentAnimalAudio = null;

        function playClick() { document.getElementById('clickSound').play(); }
        
        // Fungsi untuk putar suara hewan
        function playAnimalSound() {
            const page = pages[currentPage];
            if (page.img !== "cake") {
                const audioName = page.img.replace('.png', '.mp3');
                const audio = new Audio(audioName);
                audio.play();
            }
        }

        function start() {
            playClick(); document.getElementById('bgMusic').play();
            document.getElementById('suratBtn').style.display = 'none';
            document.getElementById('letter-container').style.display = 'block';
            document.getElementById('navControls').style.display = 'flex';
            updatePage();
        }

        function updatePage() {
            const page = pages[currentPage];
            document.getElementById('text').innerText = page.text;
            
            const img = document.getElementById('displayImg');
            const cake = document.getElementById('cake');

            if (page.img === "cake") {
                img.style.display = 'none';
                cake.style.display = 'block';
                cake.style.filter = "none";
            } else {
                img.style.display = 'block';
                img.src = page.img;
                cake.style.display = 'none';
            }
        }

        function blowCandle() {
            document.getElementById('cake').style.filter = "grayscale(100%) brightness(50%)";
            setTimeout(() => {
                document.getElementById('hbd-overlay').style.display = 'flex';
            }, 500);
        }

        function changePage(dir) {
            currentPage = Math.max(0, Math.min(pages.length - 1, currentPage + dir));
            updatePage();
        }
    </script>
</body>
</html>
